name: Engine verification

# Runs the full local pipeline (real rasterisation + real OCR + real healing)
# and uploads the before/after images so a regression is visible, not just red.

on:
  push:
    branches: [main]
    paths:
      - "src/lib/editor/**"
      - "verify/**"
      - ".github/workflows/engine-verify.yml"
  pull_request:
    paths:
      - "src/lib/editor/**"
      - "verify/**"
  workflow_dispatch:

jobs:
  verify:
    name: Heal & finish pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Run engine verification
        run: npm run verify

      - name: Upload before/after artifacts
        uses: actions/upload-artifact@v4
        with:
          name: engine-verification
          path: artifacts/**
          if-no-files-found: warn
          retention-days: 14
